<!doctype html>
<html lang="zh-CN" data-theme="easy-whistle">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>NLab Easy Whistle · 交互原型</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.7.47/daisyui.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-base-100: #ffffff;
        --color-base-200: #f5f7f6;
        --color-base-300: #dfe5e2;
        --color-base-content: #334155;
        --color-primary: #24785a;
        --color-primary-content: #ffffff;
        --color-secondary: #506e61;
        --color-secondary-content: #ffffff;
        --color-accent: #678973;
        --color-accent-content: #ffffff;
        --color-neutral: #334155;
        --color-neutral-content: #ffffff;
        --color-info: #4e7287;
        --color-info-content: #ffffff;
        --color-success: #357857;
        --color-success-content: #ffffff;
        --color-warning: #b7771f;
        --color-warning-content: #ffffff;
        --color-error: #b94c4c;
        --color-error-content: #ffffff;
        --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
    </style>
    <style>
      :root[data-theme="easy-whistle"] {
        --color-base-100: #ffffff;
        --color-base-200: #f5f7f6;
        --color-base-300: #dfe5e2;
        --color-base-content: #334155;
        --color-primary: #24785a;
        --color-primary-content: #ffffff;
        --color-secondary: #506e61;
        --color-secondary-content: #ffffff;
        --color-accent: #678973;
        --color-accent-content: #ffffff;
        --color-neutral: #334155;
        --color-neutral-content: #ffffff;
        --color-info: #4e7287;
        --color-info-content: #ffffff;
        --color-success: #357857;
        --color-success-content: #ffffff;
        --color-warning: #b7771f;
        --color-warning-content: #ffffff;
        --color-error: #b94c4c;
        --color-error-content: #ffffff;
        --radius-selector: 0.3rem;
        --radius-field: 0.35rem;
        --radius-box: 0.6rem;
        --size-selector: 0.25rem;
        --size-field: 0.25rem;
        --border: 1px;
        --depth: 0;
        --noise: 0;
        color-scheme: light;
      }
    </style>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body class="min-w-[1120px] min-h-screen bg-base-100 font-sans text-base-content antialiased">
    <main class="mx-auto max-w-[1176px] px-8 pt-12 pb-10">
      <header class="mb-7 flex items-center justify-between gap-5">
        <div class="flex items-center gap-3"><h1 class="text-xl font-semibold tracking-tight">NLab Easy Whistle</h1><span class="rounded border border-base-300 px-1.5 py-0.5 text-[10px] text-base-content/45">原型</span></div>
        <div class="flex items-center gap-2">
          <button id="import-button" class="btn btn-sm bg-base-100 font-normal">导入 YAML</button>
          <button id="export-button" class="btn btn-sm bg-base-100 font-normal">导出 YAML</button>
          <button id="add-rule" class="btn btn-sm ml-1 font-medium" aria-haspopup="dialog" aria-controls="rule-dialog">＋ 新增规则</button>
          <input id="import-file" type="file" accept=".yaml,.yml,text/yaml,application/yaml" class="hidden" aria-label="选择 YAML 配置文件" />
        </div>
      </header>

      <div class="overflow-hidden rounded-lg border border-base-300">
        <table class="table w-full table-fixed" aria-label="代理规则配置">
          <colgroup><col class="w-[76px]" /><col /><col class="w-[156px]" /><col class="w-[205px]" /><col class="w-[108px]" /></colgroup>
          <thead class="bg-base-200/80 text-xs font-normal text-base-content/55"><tr><th class="py-3 pl-5 font-normal">启用</th><th class="font-normal">请求匹配规则</th><th class="font-normal">代理环境</th><th class="font-normal">测试机</th><th class="pr-5 text-right font-normal">操作</th></tr></thead>
          <tbody id="rules-table"></tbody>
        </table>
      </div>

      <footer class="mt-5 flex items-center justify-between gap-4">
        <button id="open-connection" class="btn btn-ghost h-auto min-h-0 p-0 text-xs font-normal text-base-content/45 hover:bg-transparent" aria-haspopup="dialog" aria-controls="connection-dialog">Whistle：<span id="connection-url" class="font-mono">http://127.0.0.1:8899</span><span class="ml-1 underline underline-offset-2">设置</span></button>
        <div class="flex items-center gap-4"><p class="text-xs text-base-content/40">原型未连接 Whistle</p><button id="apply-button" class="btn btn-primary btn-sm px-5 font-medium">应用</button></div>
      </footer>
    </main>

    <div id="notice" class="toast toast-bottom toast-center hidden z-50" role="status" aria-live="polite"><div id="notice-text" class="rounded-lg border border-base-300 bg-base-100 px-5 py-3 text-sm shadow-sm"></div></div>

    <dialog id="rule-dialog" class="modal" aria-labelledby="rule-title">
      <div class="modal-box max-w-xl p-6">
        <h2 id="rule-title" class="text-base font-semibold">新增规则</h2>
        <form id="rule-form" class="mt-5">
          <label for="rule-patterns" class="mb-2 block text-xs font-medium">请求匹配规则 <span class="font-normal text-base-content/45">每行一项</span></label>
          <textarea id="rule-patterns" class="textarea h-36 w-full resize-y font-mono text-xs leading-6" placeholder="*/your_service&#10;*/u/your_service" required autofocus></textarea>
          <div class="mt-4 grid grid-cols-2 gap-4">
            <div><label for="rule-environment" class="mb-2 block text-xs font-medium">代理环境</label><select id="rule-environment" class="select select-sm w-full"><option value="test">测试环境</option><option value="sandbox">沙箱环境</option></select></div>
            <div><label for="rule-machine" class="mb-2 block text-xs font-medium">测试机</label><select id="rule-machine" class="select select-sm w-full"></select></div>
          </div>
          <label class="mt-5 flex w-fit cursor-pointer items-center gap-2.5 text-xs"><input id="rule-enabled" type="checkbox" class="toggle toggle-sm toggle-success" checked />启用这条规则</label>
          <p id="rule-error" class="mt-3 hidden text-xs text-error" role="alert"></p>
          <div class="modal-action mt-6"><button type="button" data-close="rule-dialog" class="btn btn-sm">取消</button><button class="btn btn-sm" type="submit">保存规则</button></div>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop"><button aria-label="关闭规则编辑窗口">关闭</button></form>
    </dialog>

    <dialog id="machine-dialog" class="modal" aria-labelledby="machine-title">
      <div class="modal-box max-w-sm p-6">
        <h2 id="machine-title" class="text-base font-semibold">新增测试机</h2>
        <form id="machine-form" class="mt-5">
          <label for="machine-input" class="mb-2 block text-xs font-medium">测试机名称</label>
          <input id="machine-input" class="input input-sm w-full" placeholder="例如 jacobzy" autocomplete="off" required autofocus />
          <p id="machine-error" class="mt-2 hidden text-xs text-error" role="alert"></p>
          <div class="modal-action mt-5"><button type="button" data-close="machine-dialog" class="btn btn-sm">取消</button><button class="btn btn-sm" type="submit">保存并选择</button></div>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop"><button aria-label="关闭新增测试机窗口">关闭</button></form>
    </dialog>

    <dialog id="connection-dialog" class="modal" aria-labelledby="connection-title">
      <div class="modal-box max-w-md p-6">
        <h2 id="connection-title" class="text-base font-semibold">Whistle 地址</h2>
        <form id="connection-form" class="mt-5">
          <label for="connection-input" class="mb-2 block text-xs font-medium">HTTP 地址</label><input id="connection-input" class="input input-sm w-full font-mono text-sm" type="url" placeholder="http://127.0.0.1:8899" required autofocus />
          <p id="connection-error" class="mt-2 hidden text-xs text-error" role="alert"></p>
          <div class="modal-action mt-5"><button type="button" data-close="connection-dialog" class="btn btn-sm">取消</button><button class="btn btn-sm" type="submit">保存地址</button></div>
        </form>
      </div>
      <form method="dialog" class="modal-backdrop"><button aria-label="关闭 Whistle 地址窗口">关闭</button></form>
    </dialog>

    <dialog id="import-dialog" class="modal" aria-labelledby="import-title">
      <div class="modal-box max-w-md p-6"><h2 id="import-title" class="text-base font-semibold">导入配置</h2><p id="import-summary" class="mt-4 break-all text-sm leading-6 text-base-content/60"></p><p class="mt-2 text-xs leading-5 text-base-content/45">替换此浏览器中的原型配置，不会向 Whistle 发送请求。</p><div class="modal-action mt-5"><button data-close="import-dialog" class="btn btn-sm">取消</button><button id="confirm-import" class="btn btn-sm">替换配置</button></div></div>
      <form method="dialog" class="modal-backdrop"><button aria-label="关闭导入配置窗口">关闭</button></form>
    </dialog>
  </body>
</html>
